openapi: 3.0.3
info:
  title: SoulSync AI API
  version: 1.0.0
  description:
    'REST API for SoulSync AI, a wellness habit tracker with a consent-based AI assistant.


    Authentication uses an HTTP-only session cookie (`soulsync_token`) set by `/auth/login` or `/auth/register`;
    send requests with credentials. Successful responses are `{ success: true, data, meta? }`; errors
    are `{ success: false, error: { code, message, details?, requestId } }`.


    AI output is general wellness information, not medical advice.'
servers:
  - url: http://localhost:5000/api/v1
    description: Local
  - url: https://soulsync-api.onrender.com/api/v1
    description: Render (replace with your service URL)
tags:
  - name: Authentication
  - name: Profile
  - name: Wellness
  - name: Journal
  - name: Analytics
  - name: AI
  - name: Goals
  - name: Routines
  - name: Notifications
  - name: Reports
  - name: Resources
  - name: Admin
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new account
      description:
        Creates a `user`-role account with AI consent off and signs the user in by setting
        the HTTP-only `soulsync_token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      security: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description:
        Sets the HTTP-only session cookie. Wrong email and wrong password return the same 401.
        Suspended accounts get 403 `ACCOUNT_SUSPENDED` after the password is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out (clears the cookie)
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags:
        - Profile
      summary: Get profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Profile
      summary: Update profile, timezone, reminder preferences, onboarding
      description:
        Only the listed fields are accepted; role, status and consent cannot be changed here.
        `reminderPrefs` is merged field by field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfile'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Profile
      summary: Delete account and all data
      description:
        Requires the password. Removes every record the user owns. The last administrator cannot
        be deleted (409 `LAST_ADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccount'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/password:
    patch:
      tags:
        - Profile
      summary: Change password
      description: Revokes sessions issued earlier and issues a new cookie for this device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/ai-consent:
    put:
      tags:
        - Profile
      summary: Grant or withdraw AI consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConsent'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      aiConsent:
                        type: boolean
                      aiConsentAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /wellness:
    get:
      tags:
        - Wellness
      summary: List records (newest first)
      description: Defaults to the last 30 days. `meta.range` reports the resolved range.
      parameters:
        - &id003
          $ref: '#/components/parameters/Page'
        - &id004
          $ref: '#/components/parameters/Limit'
        - name: from
          in: query
          required: false
          schema: &id001
            type: string
            format: date
            example: '2026-11-16'
        - name: to
          in: query
          required: false
          schema: *id001
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WellnessLog'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Wellness
      summary: Create the day’s record
      description:
        '`date` defaults to today in the user’s timezone and cannot be in the future. A second
        record for the day returns 409 `WELLNESS_LOG_EXISTS` with `details.existingLogId`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellnessCreate'
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/WellnessLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /wellness/date/{date}:
    get:
      tags:
        - Wellness
      summary: Get the record for a date
      parameters:
        - name: date
          in: path
          required: true
          schema: *id001
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/WellnessLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wellness/{id}:
    get:
      tags:
        - Wellness
      summary: Get a record
      parameters:
        - &id002
          $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/WellnessLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Wellness
      summary: Edit metrics (null clears one)
      parameters:
        - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellnessUpdate'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/WellnessLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Wellness
      summary: Delete a record
      parameters:
        - *id002
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Deleted, no content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /journal:
    get:
      tags:
        - Journal
      summary: List entries
      parameters:
        - *id003
        - *id004
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - entry
              - reflection
              - checkin
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema: *id001
        - name: to
          in: query
          required: false
          schema: *id001
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JournalEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Journal
      summary: Create an entry (private)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalCreate'
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/JournalEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /journal/{id}:
    get:
      tags:
        - Journal
      summary: Get an entry
      parameters:
        - *id002
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/JournalEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Journal
      summary: Edit an entry
      parameters:
        - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalUpdate'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/JournalEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Journal
      summary: Delete an entry
      parameters:
        - *id002
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Deleted, no content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /analytics/overview:
    get:
      tags:
        - Analytics
      summary: Dashboard overview (today, latest, streak, goals, unread)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /analytics/trends:
    get:
      tags:
        - Analytics
      summary: Charts and statistics
      description:
        'Calculated from stored records only. Days without a record have `recorded: false`
        and null metrics. Max 90 days.'
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum:
              - week
              - month
              - custom
          description: week = last 7 days, month = last 30 days, custom needs `from`
        - name: from
          in: query
          required: false
          schema: *id001
        - name: to
          in: query
          required: false
          schema: *id001
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Trends'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ai/chat:
    post:
      tags:
        - AI
      summary: Chat with the wellness assistant
      description:
        Allowed without consent, but then no tracked data is sent. Crisis, medical and prompt-injection
        messages get a canned safety reply (no provider call, no quota). 429 `AI_QUOTA_EXCEEDED` after
        the daily limit; 502/503/504 when the provider fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ChatResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ai/recommendations:
    post:
      tags:
        - AI
      summary: Personalised recommendations (needs consent)
      description:
        403 `AI_CONSENT_REQUIRED` without consent; 400 `INSUFFICIENT_DATA` with fewer than
        3 logged days in the last 14.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RecommendationsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ai/routine:
    post:
      tags:
        - AI
      summary: Generate a draft daily routine (needs consent)
      description:
        Returns an unsaved draft; save it with `POST /routines`. Free-text preferences pass
        the same safety check (422 `AI_INPUT_NOT_SUPPORTED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineRequest'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RoutineResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ai/weekly-summary:
    post:
      tags:
        - AI
      summary: Weekly AI summary on the calculated report (needs consent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklySummaryRequest'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/WeeklySummaryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ai/usage:
    get:
      tags:
        - AI
      summary: Today’s AI quota
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AiUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ai/conversations:
    get:
      tags:
        - AI
      summary: List saved conversations
      parameters:
        - *id003
        - *id004
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ai/conversations/{id}:
    get:
      tags:
        - AI
      summary: Get a conversation with its messages
      parameters:
        - *id002
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - AI
      summary: Delete a conversation
      parameters:
        - *id002
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Deleted, no content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /goals:
    get:
      tags:
        - Goals
      summary: List goals with progress
      parameters:
        - *id003
        - *id004
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - done
              - missed
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Goals
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /goals/{id}:
    get:
      tags:
        - Goals
      summary: Get a goal
      parameters:
        - *id002
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
